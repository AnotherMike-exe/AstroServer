# Dependabot version updates. Grouped, so one ecosystem opens one pull request a week.
# Pull requests target dev, the integration branch, and reach main with a release.
version: 2
updates:
  # Always present. A pinned action rots, and an unmaintained action is a supply
  # chain problem.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  # Astro, Starlight and friends. Major versions come as separate pull requests,
  # because an Astro major usually needs the upgrade guide.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @astrojs/check supports the TypeScript majors it lists as peers. Move
      # TypeScript by hand when @astrojs/check adds the next one.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Base images. Patch updates only:
  # - nginx odd minors (1.31, 1.33) are the mainline branch; this image tracks
  #   stable (even minors). Move to the next stable by hand each April.
  # - node stays on the Active LTS major. Move by hand once the next major is LTS.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
