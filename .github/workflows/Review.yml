name: Review

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # astro check covers types and content frontmatter. There are no unit tests:
      # the site is content, and the image smoke test in BuildImage.yml exercises it.
      - name: Astro check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Shell syntax
        run: sh -n scripts/Entrypoint.sh

  claude-review:
    name: Claude review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # A secret cannot appear in an `if`, so the step reads it through env.
    # Forks and repos without the secret skip the review and stay green.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: env.ANTHROPIC_API_KEY != ''
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            Review this pull request for correctness, security and adherence to
            the conventions in docs/CLAUDE.md. Comment only on real problems.
