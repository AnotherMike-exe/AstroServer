# NGINX config for AstroServer.
# Starts from the config in Astro's Docker recipe (port 8080, gzip, 404 page,
# try_files for clean URLs) and adds caching, security headers, a health endpoint,
# and logs under /config.

# Written at start-up by Entrypoint.sh: the `user` that matches PUID/PGID, and
# the error_log level that matches DEBUG.
include /etc/nginx/runtime.conf;

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    # Two destinations: the container log (Unraid's log viewer) and /config.
    access_log /dev/stdout main;
    access_log /config/logs/access.log main;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss
               text/javascript image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # A reverse proxy in front (Nginx Proxy Manager, a tunnel) handles TLS.
        # Redirects keep the path relative, so they never point at :8080.
        absolute_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Astro puts hashed asset names in /_astro/. A changed file gets a new name,
        # so browsers can keep these for a year.
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/index.html $uri.html =404;
        }

        # Site-specific additions (redirects, extra headers) from the /config volume.
        # Nothing breaks when the folder is empty. See CustomExample.conf.
        include /config/nginx/*.conf;
    }
}
